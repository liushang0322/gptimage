version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: gptimage-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gptimage
      POSTGRES_USER: gptimage
      POSTGRES_PASSWORD: gptimage123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gptimage"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: gptimage-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:3000"
    environment:
      DATABASE_URL: "postgresql://gptimage:gptimage123@db:5432/gptimage"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:-change-this-to-a-random-string}"
      NEXTAUTH_URL: "https://image.lshang.top"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      NEXT_PUBLIC_APP_URL: "https://image.lshang.top"
    volumes:
      - uploads_data:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy

  # 初始化数据库（首次运行后可移除）
  migrate:
    build: .
    container_name: gptimage-migrate
    environment:
      DATABASE_URL: "postgresql://gptimage:gptimage123@db:5432/gptimage"
    command: npx prisma migrate deploy
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
