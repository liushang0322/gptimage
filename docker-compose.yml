networks:
  web:
    external: true

services:
  db:
    image: postgres:16-alpine
    container_name: gptimage-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gptimage
      POSTGRES_USER: gptimage
      POSTGRES_PASSWORD: gptimage123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gptimage"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/liushang0322/gptimage:latest
    container_name: gptimage-app
    restart: unless-stopped
    networks:
      - default
      - web
    environment:
      DATABASE_URL: "postgresql://gptimage:gptimage123@db:5432/gptimage"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:-change-this-to-a-random-string}"
      NEXTAUTH_URL: "https://image.lshang.top"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      NEXT_PUBLIC_APP_URL: "https://image.lshang.top"
    volumes:
      - uploads_data:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy

  # 初始化数据库（首次运行）
  migrate:
    image: liushang0322/gptimage:latest
    container_name: gptimage-migrate
    environment:
      DATABASE_URL: "postgresql://gptimage:gptimage123@db:5432/gptimage"
    command: npx prisma migrate deploy
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
