name: Build and Push Docker Image

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build Next.js
        env:
          NEXTAUTH_SECRET: placeholder-ci-secret
          NEXT_TELEMETRY_DISABLED: 1
        run: npx next build

      - name: Show .next output structure
        run: |
          echo "=== .next top-level ==="
          ls -la .next/
          echo "=== .next/standalone (if exists) ==="
          ls -la .next/standalone/ 2>/dev/null || echo "standalone dir not found!"
          echo "=== server.js location ==="
          find .next -name "server.js" 2>/dev/null || echo "no server.js found"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          # Find server.js - handle both flat and nested standalone layouts
          SERVER_JS=$(find .next/standalone -name "server.js" | head -1)
          STANDALONE_DIR=$(dirname "$SERVER_JS")
          echo "Found server.js at: $SERVER_JS"
          echo "Standalone dir: $STANDALONE_DIR"

          cat > Dockerfile.ci << DOCKEREOF
          FROM node:20-slim
          WORKDIR /app
          ENV NODE_ENV=production PORT=3000 HOSTNAME=0.0.0.0

          RUN groupadd --system --gid 1001 nodejs \\
           && useradd --system --uid 1001 --gid nodejs nextjs \\
           && mkdir -p /app/public/uploads

          COPY public ./public
          COPY prisma ./prisma
          COPY ${STANDALONE_DIR}/ ./
          COPY .next/static ./.next/static
          RUN chown -R nextjs:nodejs /app

          USER nextjs
          EXPOSE 3000
          CMD ["node", "server.js"]
          DOCKEREOF

          cat Dockerfile.ci
          docker build -f Dockerfile.ci -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
