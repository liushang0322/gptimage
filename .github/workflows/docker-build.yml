name: Build and Push Docker Image

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build Next.js
        env:
          NEXTAUTH_SECRET: placeholder-ci-secret
          NEXT_TELEMETRY_DISABLED: 1
        run: npx next build

      - name: Show standalone structure
        run: |
          echo "=== .next/standalone full tree (2 levels) ==="
          find .next/standalone -maxdepth 3 | head -40
          echo "=== server.js locations ==="
          find .next/standalone -name "server.js"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          # Next.js standalone output can be either:
          # - .next/standalone/server.js
          # - .next/standalone/<pkgname>/server.js
          if [ -f .next/standalone/server.js ]; then
            APP_DIR=".next/standalone"
            SERVER_PATH=".next/standalone/server.js"
          else
            SERVER_PATH=$(find .next/standalone -mindepth 2 -maxdepth 2 -type f -name "server.js" | head -1)
            APP_DIR=$(dirname "$SERVER_PATH")
          fi
          echo "server.js found at: ${SERVER_PATH:-<none>}"
          echo "App dir: $APP_DIR"
          test -n "$APP_DIR"
          test -f "$APP_DIR/server.js"

          # Copy static files into the right place inside standalone
          mkdir -p "$APP_DIR/public/uploads"
          mkdir -p "$APP_DIR/.next"
          cp -r .next/static "$APP_DIR/.next/"
          cp -r public "$APP_DIR/"
          cp -r prisma "$APP_DIR/"

          cat > Dockerfile.ci << DOCKEREOF
          FROM node:20-slim
          WORKDIR /app
          ENV NODE_ENV=production PORT=3000 HOSTNAME=0.0.0.0

          RUN groupadd --system --gid 1001 nodejs \
           && useradd --system --uid 1001 --gid nodejs nextjs

          COPY ${APP_DIR}/ ./
          RUN chown -R nextjs:nodejs /app

          USER nextjs
          EXPOSE 3000
          CMD ["node", "server.js"]
          DOCKEREOF

          echo "=== Dockerfile.ci ==="
          cat Dockerfile.ci

          docker build -f Dockerfile.ci -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
