name: Build and Push Docker Image

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build Next.js (standalone)
        env:
          NEXTAUTH_SECRET: placeholder-ci-secret
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
        run: |
          npx next build
          echo "=== Standalone output ==="
          find .next/standalone -maxdepth 2 -name server.js
          echo "=== Static output ==="
          ls .next/static/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          # Normalize Next.js 16 standalone output (nested under project-name folder)
          PKG_NAME=$(node -e "console.log(require('./package.json').name)")
          mv ".next/standalone/$PKG_NAME" .next/standalone-tmp
          rm -rf .next/standalone
          mv .next/standalone-tmp .next/standalone

          cat > Dockerfile.ci << 'DOCKEREOF'
          FROM node:20-slim AS runner
          WORKDIR /app

          ENV NODE_ENV=production
          ENV PORT=3000
          ENV HOSTNAME=0.0.0.0

          RUN groupadd --system --gid 1001 nodejs \
           && useradd --system --uid 1001 --gid nodejs nextjs \
           && mkdir -p /app/public/uploads

          COPY public ./public
          COPY prisma ./prisma
          COPY .next/standalone ./
          COPY .next/static ./.next/static

          RUN chown -R nextjs:nodejs /app

          USER nextjs
          EXPOSE 3000
          CMD ["node", "server.js"]
          DOCKEREOF

          docker build -f Dockerfile.ci -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
