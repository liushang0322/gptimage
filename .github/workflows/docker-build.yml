name: Build and Push Docker Image

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Debug file listing
        run: |
          echo "=== next.config.ts ==="
          cat next.config.ts
          echo "=== package.json scripts ==="
          node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).scripts.build)"
          echo "=== prisma schema ==="
          wc -c prisma/schema.prisma
          echo "=== next version ==="
          npx next --version

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build Next.js
        env:
          NEXTAUTH_SECRET: placeholder
          NEXT_TELEMETRY_DISABLED: 1
        run: npx next build 2>&1 | tee build.log || { cat build.log; exit 1; }

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          echo "=== Files before docker build ==="
          ls -la .next/standalone/server.js
          ls -la .next/standalone/package.json
          ls -la .next/static/
          
          cat > Dockerfile.prod << 'EOF'
          FROM node:20-slim
          WORKDIR /app
          ENV NODE_ENV=production
          
          RUN groupadd --system --gid 1001 nodejs && \
              useradd --system --uid 1001 --gid nodejs nextjs
          
          COPY public ./public
          COPY prisma ./prisma
          COPY .next/standalone ./
          COPY .next/static ./.next/static
          
          RUN mkdir -p /app/public/uploads && chown -R nextjs:nodejs /app
          
          USER nextjs
          EXPOSE 3000
          ENV PORT=3000
          ENV HOSTNAME=0.0.0.0
          
          CMD ["node", "server.js"]
          EOF

          docker build -f Dockerfile.prod -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest . 2>&1 || {
            echo "BUILD FAILED, running with --progress=plain:"
            docker build --progress=plain -f Dockerfile.prod -t test . 2>&1
            exit 1
          }
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest